<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>jQuery</title>
<script src="js/jquery.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
<script>
	$( function() {
		$( "#zebre" ).draggable({
			axis: "x"
		});
		$( "#loutre" ).draggable({
			axis: "y"
		});
	} );
</script>
<style>
    #zebre, #loutre {
        width: 300px;
        height: 199px;
        border: 1px solid #333;
    }
</style>
</head>
<body>
<div id="zebre">
	<img src="zebre.jpg">
</div>
<div id="loutre">
	<img src="loutre.jpg">
</div>
</body>
</html>
