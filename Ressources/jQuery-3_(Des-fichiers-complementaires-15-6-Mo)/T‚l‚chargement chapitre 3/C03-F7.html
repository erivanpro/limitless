<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>jQuery</title>
<script src="js/jquery.js"></script>
<script>
	$(document).ready(function() {
        $("#nom").focus(function(){
			$(this).css("background-color","lightgreen");
		});
        $("#nom").blur(function(){
			$(this).css("background-color","initial");
		});
	});
</script>
</head>
<body>
<form action="#">
    <label for="nom">Nom :</label>
    <input id="nom" type="text" name="le-nom">
    <br>
    <label for="prenom">Prénom :</label>
    <input id="prenom" type="text" name="le-prenom">
</form>
</body>
</html>
