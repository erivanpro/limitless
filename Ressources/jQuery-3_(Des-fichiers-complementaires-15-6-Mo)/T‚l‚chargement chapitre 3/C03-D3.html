<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>jQuery</title>
<script src="js/jquery.js"></script>
<script>
    $(document).ready(function() {
        $(".fond-gris").css("border","1px solid black");
    });
</script>
<style>
    p {
        width: 200px;
        padding: 3px;
    }
    .fond-gris {
        background-color: #eee;
		}
</style>
</head>
<body>
<p class="fond-gris">Paragraphe 1</p>
<p>Paragraphe 2</p>
<p class="fond-gris">Paragraphe 3</p>
</body>
</html>
