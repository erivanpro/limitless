<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>jQuery</title>
<script src="js/jquery.js"></script>
<script>
	$(document).ready(function() {
        var i=1;
		$("#parent").mouseenter(function(){
			$("#evenement").text("mouseenter");
            $("#compteur").text(i++);
		});
        $("#parent").mouseleave(function(){
			$("#evenement").text("mouseleave");
		});
	});
</script>
<style>
    #parent {
        border: solid 2px #000;
        background-color: #eee;
        width: 200px;
        height: 200px;
    }
    #enfant {
        position: relative;
        left: 50px;
        top: 50px;
        border: solid 1px #000;
        background-color: #bbb;
        width: 100px;
        height: 100px;
    }
</style>
</head>
<body>
<div id="parent">
    <div id="enfant">
        &nbsp;
    </div>
</div>
<p id="evenement">&nbsp;</p>
<p id="compteur">&nbsp;</p>
</body>
</html>
