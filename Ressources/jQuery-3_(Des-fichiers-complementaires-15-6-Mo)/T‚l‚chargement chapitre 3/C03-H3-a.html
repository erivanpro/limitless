<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>jQuery</title>
<script src="js/jquery.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
<script>
	$( function() {
		$( "#zebre" ).draggable();
		$( "#cible" ).droppable({
			drop: function( event, ui ) {
				$( this )
					.addClass( "gagne" )
					.find( "h3" )
					.html( "Gagné !" );
			}
		});
	} );
</script>
<style>
    #zebre {
        float: left;
        width: 300px;
        height: 199px;
        border: 1px solid #333;
    }
    #cible {
    	float: left;
    	margin-left: 50px;
    	width: 400px;
    	height: 300px;
    	border: 3px solid #000;
    }
    #cible h3 {
    	text-align: center;
    }
    .gagne {
    	background-color: gold;
    }
</style>
</head>
<body>
<div id="zebre">
	<img src="zebre.jpg">
</div>
<div id="cible"><h3>Glissez le zèbre ici !</h3></div>
</body>
</html>
