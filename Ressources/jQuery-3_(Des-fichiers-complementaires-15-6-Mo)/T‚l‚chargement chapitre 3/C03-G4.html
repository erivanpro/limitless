<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>jQuery</title>
<script src="js/jquery.js"></script>
<script>
	$(document).ready(function() {
        $("#afficher").click(function(){
			$("#cible").fadeIn(5000);
		});
        $("#masquer").click(function(){
			$("#cible").fadeOut(5000);
		});
	});
</script>
</head>
<body>
<button id="afficher">Afficher</button>
<button id="masquer">Masquer</button>
<div id="cible">
    <img src="zebre.jpg">
</div>
</body>
</html>
