<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jQuery graph.js Plugin Demo</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bar.css">
</head>
<body>
  <div id="wrapper">
    <div class="chart">
      <h3>Les résultats pour le grand ouest</h3>
      <table id="data-table" border="1" cellpadding="10" cellspacing="0">
        <thead>
          <tr>
            <td>&nbsp;</td>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Angers</th>
            <td>55</td>
          </tr>
          <tr>
            <th scope="row">Brest</th>
            <td>90</td>
          </tr>
          <tr>
            <th scope="row">Le Mans</th>
            <td>70</td>
          </tr>
          <tr>
            <th scope="row">Nantes</th>
            <td>40</td>
          </tr>
          <tr>
            <th scope="row">Rennes</th>
            <td>85</td>
          </tr>
          <tr>
            <th scope="row">Vannes</th>
            <td>60</td>
          </tr>
      </tbody>
      </table>
    </div>
  </div>
<script src="http://code.jquery.com/jquery-3.1.0.min.js"></script>
<script src="js/graph.js"></script>
</body>
</html>
