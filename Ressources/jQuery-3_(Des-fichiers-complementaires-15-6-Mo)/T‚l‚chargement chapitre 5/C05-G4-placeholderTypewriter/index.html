<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>jQuery placeholderTypewriter Plugin Demo</title>
	<script src="http://code.jquery.com/jquery-3.1.0.slim.min.js"></script>
	<script src="placeholderTypewriter.js"></script>
	<style>
		html, body {
			background-color: #0095DD;
			font-family:'Roboto';
		}
		.wrapper {
			height: 60px;
			width: 460px;
			border-radius: 4px;
			box-shadow: 0 2px 2px rgba(0, 0, 0, .15);
			margin:30px auto;
		}
		.inputbox {
			box-sizing: border-box;
			width: 400px;
			height: 100%;
			font-size: 28px;
			background-color: #FFFFFF;
			border: 2px solid #E1E8ED;
			border-right: 0;
			border-radius: 4px 0 0 4px;
			padding: 10px;
			float: left;
			display: block;
		}
		.submit {
			height: 100%;
			width: 60px;
			float: left;
			border: 2px solid #E1E8ED;
			border-left: 0;
			box-sizing: border-box;
			background-color: #FFFFFF;
			border-radius: 0 4px 4px 0;

			background-size: 28px auto;
			background-repeat: no-repeat;
			background-position: center center;
		}
		input:focus {

		}
		h1 {
			margin: 150px auto 30px auto;
			text-align: center;
			color:#fff;
		}
	</style>
</head>
<body>
<h1>Saisissez votre destination</h1>
<form class="wrapper">
	<input class="inputbox" type="text" name="search" id="search">
	<input class="submit" type="submit" value="Search">
</form>
<script>
	$('#search').placeholderTypewriter({
		text: ["Où souhaitez-vous aller ?", "Amsterdam ?", "Paris ?", "Venise ?", "Londres ?", "New York ?", "San Francisco ?"]
	});
</script>
</body>
