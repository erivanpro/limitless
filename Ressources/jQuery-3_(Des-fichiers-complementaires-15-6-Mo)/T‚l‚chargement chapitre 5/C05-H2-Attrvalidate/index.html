<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Attr Validation</title>
	<link href='http://fonts.googleapis.com/css?family=Open+Sans' rel='stylesheet' type='text/css'>
	<link href="style.css" rel='stylesheet' type='text/css'>
</head>
<body>
<form id="testform" novalidate>
	<label for="nom">Nom</label>
	<input id="nom" name="nom" type="text" required data-error-msg="Vous ne connaissez pas votre nom ?" />
	<label for="numTel">Numéro de téléphone</label>
	<input id="numTel" name="numTel" type="tel" required />
	<label for="email">Adresse email</label>
	<input id="email" name="email" type="email"></input>
	<label for="naissance">Date de naissance</label>
	<input id="naissance" name="naissance" type="date" max="1/1/2015"></input>
	<label for="nbChat">Combien de chat avez-vous ?</label>
	<input id="nbChat" name="nbChat" type="number" min="0" required data-error-msg="Vous devez tous les compter !"></input>
	<label for="couleur">Votre couleur préférée ?</label>
	<select id="couleur" name="couleur" required>
		<option value=""></option>
		<option value="violet">Violet</option>
		<option value="bleu">Bleu</option>
		<option value="vert">Vert</option>
		<option value="rose">Rose</option>
		<option value="rouge">Rouge</option>
		<option value="jaune">Jaune</option>
		<option value="autre">Autre couleur</option>
	</select>
	<fieldset>
		<legend>Quel chocolat aimez-vous ?</legend>
		<input type="radio" id="chocNoir" name="chocolat" value="noir" required data-error-msg="Vous n'aimez pas le chocolat ? Tant pis, chosissez quand même !" />
			<label for="chocNoir">Noir</label>
		<input type="radio" id="chocLait" name="chocolat" value="lait" required />
			<label for="chocLait">Lait</label>
		<input type="radio" id="chocBlanc" name="chocolat" value="blanc" required />
			<label for="chocBlanc">Blanc</label>
	</fieldset>
	<button id="expandBtn" type="button" class="expand-trigger" aria-expanded="false" aria-controls="collapsedSection">Une autre question ?</button>
	<div id="collapsedSection" aria-hidden="true">
		<label for="commentaire">Un commentaire ?</label>
		<input id="commentaire" name="commentaire" type="text" required data-error-msg="Pas d'idée de commentaire ?"></input>
	</div>
	<div class="tandc-wrapper">
		<input id="heureux" name="heureux" type="checkbox" required data-error-msg="C'est une question philosophique, non ?"></input>
		<label for="heureux">Etes-vous heureux ?</label>
	</div>
	<button type="submit">Envoyer</button>
	<input type="reset" id="resetBtn" />
</form>
<script src="http://code.jquery.com/jquery-2.1.3.min.js" type="text/javascript"></script>
<script src="attrvalidate.jquery.js" type="text/javascript"></script>
<script type="text/javascript">
	$(document).ready(function(){
		$('#testform').attrvalidate();
		$('#resetBtn').click(function(){ $('#testform').attrvalidate('reset'); });
		$('#expandBtn').click(function(){
			var collapsible = $('#' + $(this).attr('aria-controls'));
			$(collapsible).attr('aria-hidden', ($(collapsible).attr('aria-hidden') === 'false'));
			$(this).attr('aria-expanded', ($(this).attr('aria-expanded') === 'false'));
		});
	});
</script>
</body>
</html>
