<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>jQuery jZoom Plugin Demo</title>
	<style>
		body {
			background-color:#333;
		}
		img {
			border:3px solid #fff;
		}
		.jzoom {
			position: absolute;
			top: 250px;
			left: 100px;
			width: 300px;
			height: 201px;
		}
		h1 {
			margin-top:150px;
			margin-left:100px;
			color:#fff;
		}
	</style>
	<script src="http://code.jquery.com/jquery-3.1.0.min.js"></script>
	<script src="jzoom.min.js"></script>
</head>
<body>
	<h1>Un canal à Venise</h1>
	<div class="jzoom">
		<img src="venise.jpg" height="300" width="201">
	</div>
	<script>
		$('.jzoom').jzoom({
			bgColor: "#222",
			width: 200,
			height: 200,
			position: "right",
			offsetX: 50,
		});
	</script>
</body>
</html>
