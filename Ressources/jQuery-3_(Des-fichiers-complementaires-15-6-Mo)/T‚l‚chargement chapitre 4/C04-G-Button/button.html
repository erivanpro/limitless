<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jQuery UI Button</title>
    <link rel="stylesheet" href="css/jquery-ui.min.css">
    <link rel="stylesheet" href="css/jquery-ui.structure.min.css">
    <link rel="stylesheet" href="css/jquery-ui.theme.min.css">
    <script src="js/jquery.js"></script>
    <script src="js/jquery-ui.min.js"></script>
    <script>
        $( function() {
            $( ".widget input[type=submit], .widget a, .widget button" ).button();
            $( "button, input, a" ).click( function( event ) {
                event.preventDefault();
            });
        });
    </script>
</head>
<body>
<div class="widget">
    <h3>Les widgets de type bouton :</h3>
    <button>Un élément button</button>
    <input type="submit" value="Un élément input submit">
    <a href="#">Un élément anchor</a>
</div>
<h3>Les boutons en CSS :</h3>
<button class="ui-button ui-widget ui-corner-all">Un élément button</button>
<input class="ui-button ui-widget ui-corner-all" type="submit" value="Un élément input submit">
<a class="ui-button ui-widget ui-corner-all" href="#">Un élément anchor</a>
</body>
</html>
