<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jQuery UI Button</title>
    <link rel="stylesheet" href="css/jquery-ui.min.css">
    <link rel="stylesheet" href="css/jquery-ui.structure.min.css">
    <link rel="stylesheet" href="css/jquery-ui.theme.min.css">
    <script src="js/jquery.js"></script>
    <script src="js/jquery-ui.min.js"></script>
    <script>
        $( function() {
            $("#alerte").button({
                icon: "ui-icon-alert",
                iconPosition: "end"
            } )
        } );
    </script>
</head>
<body>
<h3>Bouton en widget :</h3>
<button id="alerte">Bouton avec une icône à droite</button><br>
<h3>Bouton en CSS :</h3>
<button class="ui-button ui-widget ui-corner-all" title="Bouton avec une icône">
    <span class="ui-icon ui-icon-alert"></span> Bouton avec une icône à gauche
</button>
</body>
</html>
