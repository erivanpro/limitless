<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jQuery UI Menu</title>
    <link rel="stylesheet" href="css/jquery-ui.min.css">
    <link rel="stylesheet" href="css/jquery-ui.structure.min.css">
    <link rel="stylesheet" href="css/jquery-ui.theme.min.css">
    <script src="js/jquery.js"></script>
    <script src="js/jquery-ui.min.js"></script>
    <script>
        $( function() {
            $( "#menu_principal" ).menu();
        } );
    </script>
    <style>
        .ui-menu {
            width: 150px;
        }
    </style>
</head>
<body>
<ul id="menu_principal">
    <li class="ui-state-disabled"><div>Livre ePub</div></li>
    <li><div>Photo</div></li>
    <li><div>Tablette</div></li>
    <li><div>DVD</div>
        <ul>
            <li class="ui-state-disabled"><div>Romantique</div></li>
            <li><div>Action</div></li>
            <li><div>Polar</div></li>
        </ul>
    </li>
    <li><div>Film</div></li>
    <li><div>Musique</div>
        <ul>
            <li><div>Rock</div>
                <ul>
                    <li><div>Alternatif</div></li>
                    <li><div>Classique</div></li>
                </ul>
            </li>
            <li><div>Jazz</div>
                <ul>
                    <li><div>Freejazz</div></li>
                    <li><div>Big Band</div></li>
                    <li><div>Moderne</div></li>
                </ul>
            </li>
            <li><div>Pop</div></li>
        </ul>
    </li>
    <li class="ui-state-disabled"><div>Autre</div></li>
</ul>
</body>
</html>
