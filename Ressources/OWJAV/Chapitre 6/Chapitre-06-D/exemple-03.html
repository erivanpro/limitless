<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ma page</title>
    </head>
    <body>
		<form method="post" action="#">
			<p>
				<label for="code">Saisissez un code : </label>
				<input id="code" class="input-code" type="text"/>
			</p>
		</form>
		<script src="cleave.min.js"></script>
		<script>
			var cleave = new Cleave('.input-code', {
			    delimiter: '.',
			    blocks: [3, 4, 3, 2],
			    uppercase: true
			});
		</script>
    </body>
</html>
