<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ma page</title>
		<style>
			.boite {
				width: 100%;
				height: 200px;
				float: left;
				border: 1px solid #333;
			}
		</style>
    </head>
    <body>
		<canvas id="degrade" class="boite"></canvas>
		<p>&nbsp;</p>
		<script src="granim.min.js"></script>
		<script>
			var degrade_teintes = new Granim({
			    element: '#degrade',
			    name: 'degrade',
			    direction: 'left-right',
			    opacity: [1, 1],
			    isPausedWhenNotInView: true,
			    states : {
			        "default-state": {
			            gradients: [
			                ['#21a6ff', '#071daf'],
			                ['#fffb30', '#fc291e'],
			                ['#1efc38', '#04560d']
			            ]
			        }
			    }
			});
		</script>
    </body>
</html>
