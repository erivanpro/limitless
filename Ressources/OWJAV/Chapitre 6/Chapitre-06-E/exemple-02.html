<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ma page</title>
		<style>
			.boite {
				width: 100%;
				height: 200px;
				float: left;
				border: 1px solid #333;
			}
		</style>
    </head>
    <body>
		<canvas id="venise" class="boite"></canvas>
		<script src="granim.min.js"></script>
		<script>
			var degrade_image = new Granim({
		    element: '#venise',
		    direction: 'top-bottom',
		    opacity: [1, 1],
		    isPausedWhenNotInView: true,
		    image : {
		        source: 'venise.jpg',
		        blendingMode: 'multiply'
		    },
		    states : {
		        "default-state": {
		            gradients: [
		                ['#29323c', '#485563'],
		                ['#FF6B6B', '#556270'],
		                ['#80d3fe', '#7ea0c4'],
		                ['#f0ab51', '#eceba3']
		            ],
		            transitionSpeed: 7000
		    		    }
			    }
			});
		</script>
    </body>
</html>
