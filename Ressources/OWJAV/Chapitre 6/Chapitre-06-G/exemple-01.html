<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ma page</title>
		<style>
			.boutons {
				width: 100px;
				height: 50px;
				box-shadow: 0px 0px 10px #343434;
				border-radius: 10px;
				border: 1px solid #656565;
				background-color: #eee;
			}
		</style>
		<link href="https://unpkg.com/webkul-micron@1.1.4/dist/css/micron.min.css" type="text/css" rel="stylesheet">
		<script src="https://unpkg.com/webkul-micron@1.1.4/dist/script/micron.min.js" type="text/javascript"></script>
    </head>
    <body>
		<p><button class="boutons" data-micron="bounce" data-micron-duration="1.5" data-micron-timing="ease-out">Mon bouton</button></p>
		<p><button class="boutons" data-micron="jerk" data-micron-duration="2" data-micron-timing="ease-in">Mon bouton</button></p>
    </body>
</html>
