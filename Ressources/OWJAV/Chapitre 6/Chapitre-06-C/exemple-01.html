<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ma page</title>
		<link href="https://cdn.rawgit.com/michalsnik/aos/2.1.1/dist/aos.css" rel="stylesheet">
			<style>
				.conteneur {
					width: 100%;
					height: 500px;
					float: left;
				}
				.photo {
					border: 10px solid #333;
					width: 260px;
					height: 173px;
				}
			</style>
    </head>
    <body>
		<div class="conteneur">
			<div class="photo" data-aos="fade-zoom-in" data-aos-offset="200" data-aos-easing="ease-in-sine" data-aos-duration="2000">
				<img src="hippopotame.jpg" alt="Hippopotame" />
			</div>
		</div>
		<div class="conteneur">
			<div class="photo" data-aos="fade-right" data-aos-offset="200" data-aos-easing="ease-in-sine" data-aos-duration="2000">
				<img src="hippopotame.jpg" alt="Hippopotame" />
			</div>
		</div>
		<div class="conteneur">
			<div class="photo" data-aos="flip-right" data-aos-offset="200" data-aos-easing="ease-in-sine" data-aos-duration="2000">
				<img src="hippopotame.jpg" alt="Hippopotame" />
			</div>
		</div>
		<div class="conteneur">
			<div class="photo" data-aos="zoom-in" data-aos-offset="200" data-aos-easing="ease-in-sine" data-aos-duration="2000">
				<img src="hippopotame.jpg" alt="Hippopotame" />
			</div>
		</div>
		<script src="https://cdn.rawgit.com/michalsnik/aos/2.1.1/dist/aos.js"></script>
		<script>
			AOS.init();
		</script>
    </body>
</html>
