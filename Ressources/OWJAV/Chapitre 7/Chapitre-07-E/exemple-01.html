<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ma page</title>
	</head>
	<body>
		<div id="conteneur"></div>
		<script src="mustache.js"></script>
		<script>
			// Fournir les données internes en JSON
			var chiensJSON = {"chiens":[{"Nom":"Raja","Couleur":"Brun","Race":"Labrador"},{"Nom":"Lord","Couleur":"Beige","Race":"Beagle"},{"Nom":"Yuky","Couleur":"Noir","Race":"Caniche"}]} ;
			// Définir le template
			var leTemplate = "{{#chiens}}<h2>Nom du chien : {{Nom}}.</h2><p>Couleur du chien : {{Couleur}}.</p><p>Race du chien : {{Race}}.</p>{{/chiens}}" ;
			// Exécuter le rendu
			var rendu = Mustache.render(leTemplate,chiensJSON) ;
			// Afficher le rendu
			var leConteneur = document.getElementById('conteneur');
			leConteneur.innerHTML = rendu;
		</script>
	</body>
</html>
