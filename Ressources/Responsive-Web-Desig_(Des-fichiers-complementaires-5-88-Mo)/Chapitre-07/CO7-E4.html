<!DOCTYPE html>
<html lang="fr">
<head>
	<title>Flexbox</title>
	<meta charset="UTF-8" />
	<style>
        #boite-flexible {
            display: flex;
            flex-direction: row;
            border: solid 1px #000;
        }
        p {
            margin: 0;
            background-color: #eee;
            border: solid 1px #000;
            padding: 10px;
        }
        #p1 {
            width: 200px;
        }
        #p2 {
            flex-grow: 1;
        }
        #p3 {
            width: 200px;
        }
	</style>
</head>
<body>
<div id="boite-flexible">
    <p id="p1"><strong>Largeur fixe</strong>. Vivamus sagittis lacus vel augue laoreet rutrum faucibus dolor auctor.</p>
    <p id="p2"><strong>Largeur flexible</strong>. Integer posuere erat a ante venenatis.</p>
    <p id="p3"><strong>Largeur fixe</strong>. Donec sed odio dui. Cras mattis consectetur purus sit amet fermentum.</p>
</div>
</body>
</html>
