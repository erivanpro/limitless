<!DOCTYPE html>
<html lang="fr">
<head>
	<title>Flexbox</title>
	<meta charset="UTF-8" />
	<style>
        #boite-flexible {
            display: flex;
            flex-direction: row;
            border: solid 1px #000;
        }
        p {
            margin: 0;
            background-color: #eee;
            border: solid 1px #000;
            padding: 0px;
        }
        #p1 {
            flex-grow: 0;
            flex-shrink: 0;
            flex-basis: 20%;
        }
        #p2 {
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 30%;
        }
	</style>
</head>
<body>
<div id="boite-flexible">
    <p id="p1">Vivamus sagittis lacus vel augue laoreet rutrum faucibus dolor auctor.</p>
    <p id="p2">Integer posuere erat a ante venenatis. Inceptos Parturient Venenatis.</p>
    <p id="p3">Donec sed odio dui. Cras mattis consectetur purus sit amet fermentum.</p>
</div>
</body>
</html>
